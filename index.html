        /* ANIMATED BACKGROUND baseado no gênero */
        .genre-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0;
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .genre-background.active {
            opacity: 1;
        }

        /* HORROR - Atmosfera assustadora com névoa */
        .genre-background.horror {
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(139, 0, 0, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 30%, rgba(75, 0, 130, 0.2) 0%, transparent 50%),
                linear-gradient(180deg, #000000 0%, #0a0a0a 100%);
            animation: horrorPulse 8s ease-in-out infinite;
        }

        @keyframes horrorPulse {
            0%, 100% { filter: brightness(0.8) contrast(1.2); }
            50% { filter: brightness(0.6) contrast(1.4); }
        }

        /* ROMANCE - Suave, quente e acolhedor */
        .genre-background.romance {
            background: 
                radial-gradient(circle at 30% 20%, rgba(255, 182, 193, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(255, 192, 203, 0.1) 0%, transparent 50%),
                linear-gradient(135deg, #1a0a0f 0%, #2a1520 50%, #1a0a0f 100%);
            animation: romanceGlow 10s ease-in-out infinite;
        }

        @keyframes romanceGlow {
            0%, 100% { filter: brightness(1.1) saturate(1.2); }
            50% { filter: brightness(1.3) saturate(1.4); }
        }

        /* SCI-FI - Futurista e tecnológico */
        .genre-background.scifi {
            background: 
                radial-gradient(ellipse at 50% 0%, rgba(0, 100, 255, 0.2) 0%, transparent 70%),
                radial-gradient(ellipse at 0% 100%, rgba(0, 255, 255, 0.15) 0%, transparent 50%),
                linear-gradient(180deg, #000428 0%, #001a3d 100%);
            animation: scifiScan 6s linear infinite;

        @keyframes scifiScan {
            0% { background-position: 0% 0%, 0% 0%, 0% 0%; }
            100% { background-position: 0% 100%, 0% 0%, 0% 0%; }

        /* ACTION - Energia explosiva */
        .genre-background.action {
            background: 
                radial-gradient(ellipse at 40% 40%, rgba(255, 69, 0, 0.25) 0%, transparent 60%),

        }

        .empty-favorites {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-favorites-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-favorites-text {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .footer {
            border-top: 1px solid var(--border);
            padding: 48px 0;
            text-align: center;
            margin-top: 120px;
        }

        .footer-text {
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
        }

        @media (max-width: 1024px) {
            .filters-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .container,
            .navbar-content {
                padding-left: 24px;
                padding-right: 24px;
            }

            .hero {
                padding: 80px 0 60px;
            }

            .hero-title {
                font-size: 3rem;
            }

            .hero-subtitle {
                font-size: 1.125rem;
            }

            .movie-title {
                font-size: 2.5rem;
            }

            .movie-details {
                padding: 40px 32px;
            }

            .filters-card {
                padding: 32px 24px;
            }

            .actions-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Background dinâmico baseado no gênero -->
    <div class="genre-background default active" id="genreBackground"></div>
    <div class="grain-overlay"></div>
    
    <nav class="navbar">
        <div class="navbar-content">
            <div class="logo">GIMMEMOVIES</div>
            <div class="nav-status">
                <div class="status-dot"></div>
                <span>Online</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <section class="hero" id="heroSection">
            <h1 class="hero-title">No More Endless Scrolling</h1>
            <p class="hero-subtitle">Whether you're alone or with someone, the right movie is just one click away.</p>    
            <div class="cta-section">
                <button class="primary-btn" id="discoverBtn">Discover a Movie</button>
                <button class="secondary-btn" id="filterToggle">Customize Preferences</button>
            </div>

            <div class="filters-card" id="filtersCard">
                <div class="filters-grid">
                    <div class="filter-group">
                        <label>Genre</label>
                        <select id="genreFilter">
                            <option value="">All Genres</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label>Minimum Rating</label>
                        <select id="ratingFilter">
                            <option value="">Any Rating</option>
                            <option value="8.5">8.5+ Masterpiece</option>
                            <option value="8.0">8.0+ Outstanding</option>
                            <option value="7.0">7.0+ Excellent</option>
                            <option value="6.0">6.0+ Good</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label>Era</label>
                        <select id="decadeFilter">
                            <option value="">All Time</option>
                            <option value="2020-2025">2020s - Modern</option>
                            <option value="2010-2019">2010s - Contemporary</option>
                            <option value="2000-2009">2000s - Recent</option>
                            <option value="1990-1999">1990s - Classic</option>
                            <option value="1980-1989">1980s - Vintage</option>
                            <option value="1970-1979">1970s - Golden Era</option>
                            <option value="1940-1969">Before 1970 - Timeless</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label>Duration</label>
                        <select id="runtimeFilter">
                            <option value="">Any Length</option>
                            <option value="90">Under 90 min - Quick</option>
                            <option value="120">Under 2 hours - Standard</option>
                            <option value="150">Under 2.5 hours - Extended</option>
                            <option value="999">Any Length - Epic</option>
                        </select>
                    </div>
                </div>
            </div>
        </section>

        <section class="loading-section" id="loadingSection">
            <div class="loading-spinner"></div>
            <p class="loading-text">Analyzing cinematic masterpieces...</p>
        </section>

        <section class="result-section" id="resultSection">
            <div class="movie-container">
                <div class="movie-details">
                    <h2 class="movie-title" id="movieTitle"></h2>
                    <p class="movie-tagline" id="movieTagline"></p>
                    
                    <div class="movie-meta-row">
                        <div class="meta-item rating-badge">
                            ★ <span id="movieRating"></span>
                        </div>
                        <div class="meta-item">
                            📅 <span id="movieYear"></span>
                        </div>
                        <div class="meta-item">
                            ⏱️ <span id="movieRuntime"></span> min
                        </div>
                    </div>
                    
                    <div class="genre-list" id="genreList"></div>
                    
                    <div class="movie-credits">
                        <div class="credit-row">
                            <div class="credit-label">Director</div>
                            <div class="credit-value director" id="movieDirector"></div>
                        </div>
                        <div class="credit-row">
                            <div class="credit-label">Cast</div>
                            <div class="credit-value" id="movieCast"></div>
                        </div>
                    </div>
                    
                    <div class="reason-box">
                        <div class="reason-label">Why This Movie</div>
                        <div class="reason-text" id="movieReason"></div>
                    </div>
                    
                    <p class="movie-overview" id="movieOverview"></p>
                    
                    <div class="actions-grid" id="actionsGrid"></div>
                </div>

                <div class="another-movie-section">
                    <button class="favorite-btn" id="favoriteBtn">
                        <span id="favoriteIcon">🤍</span> <span id="favoriteText">Add to Favorites</span>
                    </button>
                    <button class="primary-btn" id="anotherBtn">Discover Another</button>
                </div>
            </div>
        </section>
    </div>

    <!-- Favorites Modal -->
    <div class="favorites-modal" id="favoritesModal">
        <div class="favorites-content">
            <div class="favorites-header">
                <h2 class="favorites-title">❤️ My Favorites</h2>
                <button class="close-modal" id="closeModal">×</button>
            </div>
            <div id="favoritesContainer"></div>
        </div>
    </div>

    <footer class="footer">
        <p class="footer-text">© 2025 GIMMEMOVIES. An easy way of choosing.</p>
    </footer>

    <script>
        class CineMatch {
            constructor() {
                this.apiBaseUrl = window.location.origin;
                this.currentMovie = null;
                this.favorites = this.loadFavorites();
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.loadGenres();
                this.updateFavoritesCount();
            }

            setupEventListeners() {
                document.getElementById('discoverBtn').addEventListener('click', () => this.discover());
                document.getElementById('anotherBtn').addEventListener('click', () => this.discover());
                document.getElementById('filterToggle').addEventListener('click', () => this.toggleFilters());
                document.getElementById('favoriteBtn').addEventListener('click', () => this.toggleFavorite());
                document.getElementById('favoritesBtn').addEventListener('click', () => this.showFavorites());
                document.getElementById('closeModal').addEventListener('click', () => this.hideFavorites());
                
                // Close modal on backdrop click
                document.getElementById('favoritesModal').addEventListener('click', (e) => {
                    if (e.target.id === 'favoritesModal') {
                        this.hideFavorites();
                    }
                });
            }

            // FAVORITES MANAGEMENT
            loadFavorites() {
                const stored = localStorage.getItem('gimmemovies_favorites');
                return stored ? JSON.parse(stored) : [];
            }

            saveFavorites() {
                localStorage.setItem('gimmemovies_favorites', JSON.stringify(this.favorites));
                this.updateFavoritesCount();
            }

            updateFavoritesCount() {
                document.getElementById('favCount').textContent = this.favorites.length;
            }

            isFavorite(movieId) {
                return this.favorites.some(fav => fav.id === movieId);
            }

            toggleFavorite() {
                if (!this.currentMovie) return;

                const movieId = this.currentMovie.id;
                const favoriteBtn = document.getElementById('favoriteBtn');
                const favoriteIcon = document.getElementById('favoriteIcon');
                const favoriteText = document.getElementById('favoriteText');

                if (this.isFavorite(movieId)) {
                    // Remove from favorites
                    this.favorites = this.favorites.filter(fav => fav.id !== movieId);
                    favoriteIcon.textContent = '🤍';
                    favoriteText.textContent = 'Add to Favorites';
                    favoriteBtn.classList.remove('active');
                } else {
                    // Add to favorites
                    this.favorites.push(this.currentMovie);
                    favoriteIcon.textContent = '❤️';
                    favoriteText.textContent = 'Remove from Favorites';
                    favoriteBtn.classList.add('active');
                }

                this.saveFavorites();
            }

            updateFavoriteButton() {
                if (!this.currentMovie) return;

                const favoriteBtn = document.getElementById('favoriteBtn');
                const favoriteIcon = document.getElementById('favoriteIcon');
                const favoriteText = document.getElementById('favoriteText');

                if (this.isFavorite(this.currentMovie.id)) {
                    favoriteIcon.textContent = '❤️';
                    favoriteText.textContent = 'Remove from Favorites';
                    favoriteBtn.classList.add('active');
                } else {
                    favoriteIcon.textContent = '🤍';
                    favoriteText.textContent = 'Add to Favorites';
                    favoriteBtn.classList.remove('active');
                }
            }

            showFavorites() {
                const modal = document.getElementById('favoritesModal');
                const container = document.getElementById('favoritesContainer');

                if (this.favorites.length === 0) {
                    container.innerHTML = `
                        <div class="empty-favorites">
                            <div class="empty-favorites-icon">💔</div>
                            <div class="empty-favorites-text">No favorites yet</div>
                            <p style="color: var(--text-muted); margin-top: 12px;">Start discovering movies and add them to your favorites!</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="favorites-grid">
                            ${this.favorites.map(movie => `
                                <div class="favorite-card">
                                    <div class="favorite-card-title">${movie.title}</div>
                                    <div class="favorite-card-meta">
                                        ${movie.year} • ⭐ ${movie.rating} • ${movie.runtime} min
                                    </div>
                                    <div class="favorite-card-meta" style="color: var(--text-muted); font-size: 0.85rem;">
                                        ${movie.genres.slice(0, 2).join(', ')}
                                    </div>
                                    <div class="favorite-card-actions">
                                        <button class="favorite-card-btn" onclick="app.viewMovie(${movie.id})">View</button>
                                        <button class="favorite-card-btn" onclick="app.removeFavorite(${movie.id})">Remove</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                modal.classList.add('show');
            }

            hideFavorites() {
                document.getElementById('favoritesModal').classList.remove('show');
            }

            async viewMovie(movieId) {
                this.hideFavorites();
                const movie = this.favorites.find(fav => fav.id === movieId);
                if (movie) {
                    this.displayMovie(movie);
                }
            }

            removeFavorite(movieId) {
                this.favorites = this.favorites.filter(fav => fav.id !== movieId);
                this.saveFavorites();
                this.showFavorites();
                this.updateFavoriteButton();
            }

            toggleFilters() {
                const card = document.getElementById('filtersCard');
                card.classList.toggle('show');
            }

            async loadGenres() {
                try {
                    const response = await fetch(`${this.apiBaseUrl}/api/genres`);
                    const data = await response.json();
                    
                    if (data.success) {
                        const select = document.getElementById('genreFilter');
                        data.genres.forEach(genre => {
                            const option = document.createElement('option');
                            option.value = genre.id;
                            option.textContent = genre.name;
                            select.appendChild(option);
                        });
                    }
                } catch (error) {
                    console.error('Genre loading failed:', error);
                }
            }

            getFilters() {
                const filters = {};
                
                const genre = document.getElementById('genreFilter').value;
                if (genre) filters.genre = genre;
                
                const rating = document.getElementById('ratingFilter').value;
                if (rating) filters.minRating = parseFloat(rating);
                
                const decade = document.getElementById('decadeFilter').value;
                if (decade) {
                    const [min, max] = decade.split('-');
                    filters.yearMin = parseInt(min);
                    filters.yearMax = parseInt(max);
                }
                
                const runtime = document.getElementById('runtimeFilter').value;
                if (runtime) filters.maxRuntime = parseInt(runtime);
                
                return filters;
            }

            async discover() {
                const filters = this.getFilters();
                
                this.showLoading();
                
                try {
                    const response = await fetch(`${this.apiBaseUrl}/api/suggest`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(filters)
                    });

                    const data = await response.json();

                    if (!data.success) {
                        alert(data.error || 'No films found. Try adjusting your preferences.');
                        this.hideLoading();
                        return;
                    }

                    this.displayMovie(data.movie);
                    
                } catch (error) {
                    console.error('Discovery failed:', error);
                    alert('Connection error. Please try again.');
                    this.hideLoading();
                }
            }

            showLoading() {
                document.getElementById('heroSection').style.display = 'none';
                document.getElementById('resultSection').classList.remove('show');
                document.getElementById('loadingSection').classList.add('show');
                document.getElementById('discoverBtn').disabled = true;
            }

            hideLoading() {
                document.getElementById('loadingSection').classList.remove('show');
                document.getElementById('discoverBtn').disabled = false;
            }

            getGenreClass(genres) {
                if (!genres || genres.length === 0) return 'default';
                
                const genreMap = {
                    'Horror': 'horror',
                    'Romance': 'romance',
                    'Sci-Fi': 'scifi',
                    'Action': 'action',
                    'Comedy': 'comedy',
                    'Drama': 'drama',
                    'Thriller': 'thriller',
                    'Fantasy': 'fantasy',
                    'Crime': 'crime',
                    'Animation': 'animation'
                };
                
                return genreMap[genres[0]] || 'default';
            }

            updateBackground(genres) {
                const bg = document.getElementById('genreBackground');
                const currentClass = Array.from(bg.classList).find(c => 
                    ['horror', 'romance', 'scifi', 'action', 'comedy', 'drama', 
                     'thriller', 'fantasy', 'crime', 'animation', 'default'].includes(c)
                );
                
                if (currentClass) {
                    bg.classList.remove(currentClass);
                }
                
                bg.classList.remove('active');
                
                setTimeout(() => {
                    const genreClass = this.getGenreClass(genres);
                    bg.classList.add(genreClass);
                    bg.classList.add('active');
                }, 100);
            }

            displayMovie(movie) {
                this.hideLoading();
                this.currentMovie = movie;
                
                // Update background based on genre
                this.updateBackground(movie.genres);
                
                // Basic info
                document.getElementById('movieTitle').textContent = movie.title;
                document.getElementById('movieTagline').textContent = movie.tagline;
                document.getElementById('movieRating').textContent = movie.rating;
                document.getElementById('movieYear').textContent = movie.year;
                document.getElementById('movieRuntime').textContent = movie.runtime || 'N/A';
                document.getElementById('movieOverview').textContent = movie.overview;
                document.getElementById('movieReason').textContent = movie.reason;
                
                // Credits
                document.getElementById('movieDirector').textContent = movie.director || 'N/A';
                document.getElementById('movieCast').textContent = Array.isArray(movie.cast) ? movie.cast.join(', ') : (movie.cast || 'N/A');
                
                // Genres
                const genreList = document.getElementById('genreList');
                genreList.innerHTML = movie.genres.map(g => 
                    `<span class="genre-badge">${g}</span>`
                ).join('');
                
                // Actions
                const actions = document.getElementById('actionsGrid');
                actions.innerHTML = `
                    ${movie.trailer ? 
                        `<a href="${movie.trailer}" target="_blank" class="action-link">
                            🎬 Watch Trailer
                        </a>` : ''
                    }
                    ${movie.imdb_id ? 
                        `<a href="https://www.imdb.com/title/${movie.imdb_id}" target="_blank" class="action-link">
                            ⭐ IMDb
                        </a>` : ''
                    }
                    <a href="https://www.justwatch.com/us/search?q=${encodeURIComponent(movie.title)}" target="_blank" class="action-link">
                        📺 Where to Watch
                    </a>
                    <a href="https://www.google.com/search?q=${encodeURIComponent(movie.title + ' ' + movie.year + ' movie')}" target="_blank" class="action-link">
                        🔍 Learn More
                    </a>
                `;

                // Update favorite button
                this.updateFavoriteButton();

                // Show result
                document.getElementById('resultSection').classList.add('show');
                
                // Smooth scroll to result
                setTimeout(() => {
                    document.getElementById('resultSection').scrollIntoView({ 
                        behavior: 'smooth', 
                        block: 'start' 
                    });
                }, 300);
            }
        }

        // Initialize the app and make it globally accessible
        let app;
        document.addEventListener('DOMContentLoaded', () => {
            app = new CineMatch();
        });
    </script>
</body>
</html>
